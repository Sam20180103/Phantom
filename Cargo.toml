[workspace]
resolver = "2"
members = ["crates/phantom-core", "crates/phantom-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
phantom-core = { path = "crates/phantom-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
portable-pty = "0.9"
dirs = "6"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true

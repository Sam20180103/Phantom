<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="topClip">
      <path d="M 0 30 C 0 13.43 13.43 0 30 0 L 370 0 C 386.57 0 400 13.43 400 30 L 400 40 L 0 40 Z"/>
    </clipPath>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="400" height="400" fill="#181a1f" rx="30"/>

  <!-- Terminal Header / Tab Bar -->
  <rect x="0" y="0" width="400" height="40" fill="#21252b" clip-path="url(#topClip)"/>
  <circle cx="30" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="200" y="25" font-family="monospace" font-size="14" fill="#636d83" text-anchor="middle">sam@phantom:~</text>

  <!-- The Character Silhouette (Hood/Cloak) -->
  <path d="M 200 80 C 130 80 90 140 90 220 L 70 320 L 330 320 L 310 220 C 310 140 270 80 200 80 Z" fill="#0d0e12" stroke="#2c313a" stroke-width="2"/>

  <!-- Inner shadow / face darkness -->
  <ellipse cx="200" cy="180" rx="45" ry="55" fill="#000000"/>

  <!-- Glowing Eyes -->
  <rect x="165" y="170" width="20" height="6" rx="3" fill="#00FFA3" filter="url(#neonGlow)"/>
  <rect x="215" y="170" width="20" height="6" rx="3" fill="#00FFA3" filter="url(#neonGlow)"/>

  <!-- The Mask (Tech/Cyberpunk lower face mask) -->
  <path d="M 140 200 L 260 200 L 230 260 L 170 260 Z" fill="#181a1f" stroke="url(#neonGradient)" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Mask details -->
  <line x1="170" y1="220" x2="230" y2="220" stroke="#00B8FF" stroke-width="2" opacity="0.6"/>
  <line x1="180" y1="240" x2="220" y2="240" stroke="#00B8FF" stroke-width="2" opacity="0.6"/>

  <!-- Text: 蒙面Sam生 -->
  <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#abb2bf" text-anchor="middle" letter-spacing="2">蒙面Sam生</text>

  <!-- Terminal Prompt -->
  <text x="200" y="385" font-family="monospace" font-size="12" fill="#5c6370" text-anchor="middle">$_ init_profile</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="#181a1f" rx="90"/>

  <g transform="translate(200 208) scale(1.3) translate(-200 -200)">
    <!-- Hood -->
    <path d="M 200 80 C 130 80 90 140 90 220 L 70 320 L 330 320 L 310 220 C 310 140 270 80 200 80 Z" fill="#0d0e12" stroke="#2c313a" stroke-width="2"/>
    <!-- Face darkness -->
    <ellipse cx="200" cy="180" rx="45" ry="55" fill="#000000"/>
    <!-- Eyes -->
    <rect x="165" y="170" width="20" height="8" rx="4" fill="#00FFA3" filter="url(#neonGlow)"/>
    <rect x="215" y="170" width="20" height="8" rx="4" fill="#00FFA3" filter="url(#neonGlow)"/>
    <!-- Mask -->
    <path d="M 140 200 L 260 200 L 230 260 L 170 260 Z" fill="#181a1f" stroke="url(#neonGradient)" stroke-width="5" filter="url(#neonGlow)"/>
  </g>
</svg>
